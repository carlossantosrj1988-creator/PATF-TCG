<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" width="380" height="160">
  <defs>
    <!-- ── Naipes vetoriais ── -->
    <symbol id="naipe-copas" viewBox="0 0 24 24">
      <path d="M12 21 C 5 15 2 11 2 7 C 2 4 4 2 7 2 C 9.5 2 11 4 12 6 C 13 4 14.5 2 17 2 C 20 2 22 4 22 7 C 22 11 19 15 12 21 Z"/>
    </symbol>
    <symbol id="naipe-ouros" viewBox="0 0 24 24">
      <path d="M12 2 L21 12 L12 22 L3 12 Z"/>
    </symbol>
    <symbol id="naipe-paus" viewBox="0 0 24 24">
      <path d="M12 2 C 9.5 2 8 4 8 6.5 C 8 8 8.5 9 9 9.5 C 7 9 5 10.5 5 13 C 5 15.5 7 17 9.5 17 C 10.5 17 11.5 16.5 12 16 L 9 22 L 15 22 L 12 16 C 12.5 16.5 13.5 17 14.5 17 C 17 17 19 15.5 19 13 C 19 10.5 17 9 15 9.5 C 15.5 9 16 8 16 6.5 C 16 4 14.5 2 12 2 Z"/>
    </symbol>
    <symbol id="naipe-espadas" viewBox="0 0 24 24">
      <path d="M12 2 C 12 2 3 9 3 14 C 3 16.5 5 18 7 18 C 8.5 18 10 17 11 15.5 L 9 22 L 15 22 L 13 15.5 C 14 17 15.5 18 17 18 C 19 18 21 16.5 21 14 C 21 9 12 2 12 2 Z"/>
    </symbol>

    <!-- ── Gradientes 3D pros valores (claro em cima, escuro embaixo) ── -->
    <linearGradient id="grad-vermelho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffb0b0"/>
      <stop offset="50%" stop-color="#e06060"/>
      <stop offset="100%" stop-color="#7a2222"/>
    </linearGradient>
    <linearGradient id="grad-verde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#b0e8c8"/>
      <stop offset="50%" stop-color="#5ac880"/>
      <stop offset="100%" stop-color="#1f5a30"/>
    </linearGradient>
    <linearGradient id="grad-dourado" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffe8a8"/>
      <stop offset="50%" stop-color="#e8c050"/>
      <stop offset="100%" stop-color="#7a5a10"/>
    </linearGradient>
    <linearGradient id="grad-azul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#c0d8ff"/>
      <stop offset="50%" stop-color="#7aade8"/>
      <stop offset="100%" stop-color="#2a4878"/>
    </linearGradient>

    <!-- ── Filter de profundidade: sombra dura curta + sombra difusa longa ── -->
    <filter id="depth" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="3" stdDeviation="2"   flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ── Fundo do mockup ── -->
  <rect width="380" height="160" fill="#0d0d1a"/>

  <!-- ══════════════════════════════════════════════════════════════════
       CARTA 1 — Ás de Copas (♥ vermelho)
  ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(14,28)">
    <rect width="72" height="104" rx="8" fill="#fafaf5" stroke="#1a1a1a" stroke-width="1"/>
    <use href="#naipe-copas" x="14" y="32" width="44" height="44" fill="#e06060"
         style="filter: drop-shadow(0 0 4px #e06060);"/>

    <!-- Valor canto superior esquerdo (3D, saltando da carta) -->
    <text x="2" y="-4" font-family="Cinzel, serif" font-size="32" font-weight="900"
          fill="url(#grad-vermelho)" stroke="#3a0808" stroke-width="1.5" paint-order="stroke"
          filter="url(#depth)">A</text>
    <use href="#naipe-copas" x="-4" y="14" width="14" height="14" fill="#e06060"
         stroke="#3a0808" stroke-width="0.8" filter="url(#depth)"/>

    <!-- Valor canto inferior direito (rotacionado 180) -->
    <g transform="rotate(180 64 96)">
      <text x="46" y="100" font-family="Cinzel, serif" font-size="32" font-weight="900"
            fill="url(#grad-vermelho)" stroke="#3a0808" stroke-width="1.5" paint-order="stroke"
            filter="url(#depth)">A</text>
      <use href="#naipe-copas" x="40" y="118" width="14" height="14" fill="#e06060"
           stroke="#3a0808" stroke-width="0.8" filter="url(#depth)"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       CARTA 2 — Ás de Paus (♣ verde)
  ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(102,28)">
    <rect width="72" height="104" rx="8" fill="#fafaf5" stroke="#1a1a1a" stroke-width="1"/>
    <use href="#naipe-paus" x="14" y="32" width="44" height="44" fill="#5ac880"
         style="filter: drop-shadow(0 0 4px #5ac880);"/>

    <text x="2" y="-4" font-family="Cinzel, serif" font-size="32" font-weight="900"
          fill="url(#grad-verde)" stroke="#0a2a18" stroke-width="1.5" paint-order="stroke"
          filter="url(#depth)">A</text>
    <use href="#naipe-paus" x="-4" y="14" width="14" height="14" fill="#5ac880"
         stroke="#0a2a18" stroke-width="0.8" filter="url(#depth)"/>

    <g transform="rotate(180 64 96)">
      <text x="46" y="100" font-family="Cinzel, serif" font-size="32" font-weight="900"
            fill="url(#grad-verde)" stroke="#0a2a18" stroke-width="1.5" paint-order="stroke"
            filter="url(#depth)">A</text>
      <use href="#naipe-paus" x="40" y="118" width="14" height="14" fill="#5ac880"
           stroke="#0a2a18" stroke-width="0.8" filter="url(#depth)"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       CARTA 3 — Ás de Ouros (♦ dourado)
  ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(190,28)">
    <rect width="72" height="104" rx="8" fill="#fafaf5" stroke="#1a1a1a" stroke-width="1"/>
    <use href="#naipe-ouros" x="14" y="32" width="44" height="44" fill="#e8c050"
         style="filter: drop-shadow(0 0 4px #e8c050);"/>

    <text x="2" y="-4" font-family="Cinzel, serif" font-size="32" font-weight="900"
          fill="url(#grad-dourado)" stroke="#3a2808" stroke-width="1.5" paint-order="stroke"
          filter="url(#depth)">A</text>
    <use href="#naipe-ouros" x="-4" y="14" width="14" height="14" fill="#e8c050"
         stroke="#3a2808" stroke-width="0.8" filter="url(#depth)"/>

    <g transform="rotate(180 64 96)">
      <text x="46" y="100" font-family="Cinzel, serif" font-size="32" font-weight="900"
            fill="url(#grad-dourado)" stroke="#3a2808" stroke-width="1.5" paint-order="stroke"
            filter="url(#depth)">A</text>
      <use href="#naipe-ouros" x="40" y="118" width="14" height="14" fill="#e8c050"
           stroke="#3a2808" stroke-width="0.8" filter="url(#depth)"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       CARTA 4 — Ás de Espadas (♠ azul)
  ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(278,28)">
    <rect width="72" height="104" rx="8" fill="#fafaf5" stroke="#1a1a1a" stroke-width="1"/>
    <use href="#naipe-espadas" x="14" y="32" width="44" height="44" fill="#7aade8"
         style="filter: drop-shadow(0 0 4px #7aade8);"/>

    <text x="2" y="-4" font-family="Cinzel, serif" font-size="32" font-weight="900"
          fill="url(#grad-azul)" stroke="#0a1830" stroke-width="1.5" paint-order="stroke"
          filter="url(#depth)">A</text>
    <use href="#naipe-espadas" x="-4" y="14" width="14" height="14" fill="#7aade8"
         stroke="#0a1830" stroke-width="0.8" filter="url(#depth)"/>

    <g transform="rotate(180 64 96)">
      <text x="46" y="100" font-family="Cinzel, serif" font-size="32" font-weight="900"
            fill="url(#grad-azul)" stroke="#0a1830" stroke-width="1.5" paint-order="stroke"
            filter="url(#depth)">A</text>
      <use href="#naipe-espadas" x="40" y="118" width="14" height="14" fill="#7aade8"
           stroke="#0a1830" stroke-width="0.8" filter="url(#depth)"/>
    </g>
  </g>

</svg>
