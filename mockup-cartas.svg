<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140">
  <defs>
    <!-- ── Naipes como paths SVG (cor controlada por fill) ── -->
    <symbol id="naipe-copas" viewBox="0 0 24 24">
      <path d="M12 21 C 5 15 2 11 2 7 C 2 4 4 2 7 2 C 9.5 2 11 4 12 6 C 13 4 14.5 2 17 2 C 20 2 22 4 22 7 C 22 11 19 15 12 21 Z"/>
    </symbol>
    <symbol id="naipe-ouros" viewBox="0 0 24 24">
      <path d="M12 2 L21 12 L12 22 L3 12 Z"/>
    </symbol>
    <symbol id="naipe-paus" viewBox="0 0 24 24">
      <path d="M12 2 C 9.5 2 8 4 8 6.5 C 8 8 8.5 9 9 9.5 C 7 9 5 10.5 5 13 C 5 15.5 7 17 9.5 17 C 10.5 17 11.5 16.5 12 16 L 9 22 L 15 22 L 12 16 C 12.5 16.5 13.5 17 14.5 17 C 17 17 19 15.5 19 13 C 19 10.5 17 9 15 9.5 C 15.5 9 16 8 16 6.5 C 16 4 14.5 2 12 2 Z"/>
    </symbol>
    <symbol id="naipe-espadas" viewBox="0 0 24 24">
