    </symbol>
  </defs>

  <!-- ── Fundo do mockup ── -->
  <rect width="380" height="140" fill="#0d0d1a"/>

  <!-- ══════════════════════════════════════════════════════════════════
       CARTA 1 — Ás de Copas (♥ vermelho)
  ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(14,18)">
    <rect width="72" height="104" rx="8" fill="#fafaf5" stroke="#1a1a1a" stroke-width="1"/>
    <text x="8"  y="20" font-family="Cinzel, serif" font-size="14" font-weight="900" fill="#e06060">A</text>
    <use href="#naipe-copas" x="6" y="22" width="10" height="10" fill="#e06060"/>
    <use href="#naipe-copas" x="14" y="32" width="44" height="44" fill="#e06060"
         style="filter: drop-shadow(0 0 4px #e06060);"/>
    <g transform="rotate(180 64 88)">
      <text x="56" y="92" font-family="Cinzel, serif" font-size="14" font-weight="900" fill="#e06060">A</text>
      <use href="#naipe-copas" x="54" y="94" width="10" height="10" fill="#e06060"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       CARTA 2 — Ás de Paus (♣ verde)
  ══════════════════════════════════════════════════════════════════ -->
