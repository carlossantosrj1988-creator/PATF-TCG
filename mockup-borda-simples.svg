<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ── Fundo do game-container ── -->
  <rect width="1280" height="720" fill="#0a0e1a"/>

  <!-- ── Field central (placeholder do cenário) ── -->
  <rect x="0" y="52" width="1280" height="488" fill="#1a2238"/>
  <text x="640" y="296" font-family="sans-serif" font-size="22" fill="#3a4868" text-anchor="middle">FIELD (cenário)</text>

  <!-- ── Topbar fundo ── -->
  <rect x="0" y="0" width="1280" height="52" fill="#09091a"/>
  <text x="640" y="33" font-family="sans-serif" font-size="14" fill="#5a6478" text-anchor="middle">TOPBAR — 52px</text>

  <!-- ── Painel fundo ── -->
  <rect x="0" y="540" width="1280" height="180" fill="#0d0d1a"/>
  <text x="640" y="640" font-family="sans-serif" font-size="14" fill="#5a6478" text-anchor="middle">PAINEL — 180px</text>

  <!-- ══════════════════════════════════════════════════════════════════
       BORDA — TOPBAR (interna, 2px de espessura)
       Quadradinhos 10×10 nos 4 cantos internos
  ══════════════════════════════════════════════════════════════════ -->

  <rect x="1" y="1" width="1278" height="50" fill="none" stroke="#4cc8ff" stroke-width="2"/>

  <rect x="2"    y="2"  width="10" height="10" fill="#4cc8ff"/>
  <rect x="1268" y="2"  width="10" height="10" fill="#4cc8ff"/>
  <rect x="2"    y="40" width="10" height="10" fill="#4cc8ff"/>
  <rect x="1268" y="40" width="10" height="10" fill="#4cc8ff"/>

  <!-- ══════════════════════════════════════════════════════════════════
       BORDA — PAINEL (interna, 2px de espessura)
       Quadradinhos 10×10 nos 4 cantos internos
  ══════════════════════════════════════════════════════════════════ -->

  <rect x="1" y="541" width="1278" height="178" fill="none" stroke="#4cc8ff" stroke-width="2"/>

  <rect x="2"    y="542" width="10" height="10" fill="#4cc8ff"/>
  <rect x="1268" y="542" width="10" height="10" fill="#4cc8ff"/>
  <rect x="2"    y="708" width="10" height="10" fill="#4cc8ff"/>
  <rect x="1268" y="708" width="10" height="10" fill="#4cc8ff"/>

</svg>
