<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1300 740" width="1300" height="740">
  <!-- ── Fundo do game-container ── -->
  <rect x="0" y="0" width="1280" height="720" fill="#0a0e1a"/>

  <!-- ── Field central (placeholder do cenário) ── -->
  <rect x="0" y="52" width="1280" height="488" fill="#1a2238"/>
  <text x="640" y="296" font-family="sans-serif" font-size="22" fill="#3a4868" text-anchor="middle">FIELD (cenário)</text>

  <!-- ── Topbar fundo ── -->
  <rect x="0" y="0" width="1280" height="52" fill="#09091a"/>
  <text x="640" y="33" font-family="sans-serif" font-size="14" fill="#5a6478" text-anchor="middle">TOPBAR — 52px</text>

  <!-- ── Painel fundo ── -->
  <rect x="0" y="540" width="1280" height="180" fill="#0d0d1a"/>
  <text x="640" y="640" font-family="sans-serif" font-size="14" fill="#5a6478" text-anchor="middle">PAINEL — 180px</text>

  <!-- ══════════════════════════════════════════════════════════════════
       BORDA — TOPBAR (2px nas 4 arestas externas)
       Quadradinhos 10×10 CENTRADOS na quina (5px dentro, 5px fora)
  ══════════════════════════════════════════════════════════════════ -->

  <rect x="0" y="0" width="1280" height="52" fill="none" stroke="#4cc8ff" stroke-width="2"/>

  <rect x="-5"   y="-5"  width="10" height="10" fill="#4cc8ff"/>
  <rect x="1275" y="-5"  width="10" height="10" fill="#4cc8ff"/>
  <rect x="-5"   y="47"  width="10" height="10" fill="#4cc8ff"/>
  <rect x="1275" y="47"  width="10" height="10" fill="#4cc8ff"/>

  <!-- ══════════════════════════════════════════════════════════════════
       BORDA — PAINEL (2px nas 4 arestas externas)
       Quadradinhos 10×10 CENTRADOS na quina (5px dentro, 5px fora)
  ══════════════════════════════════════════════════════════════════ -->

  <rect x="0" y="540" width="1280" height="180" fill="none" stroke="#4cc8ff" stroke-width="2"/>

  <rect x="-5"   y="535" width="10" height="10" fill="#4cc8ff"/>
  <rect x="1275" y="535" width="10" height="10" fill="#4cc8ff"/>
  <rect x="-5"   y="715" width="10" height="10" fill="#4cc8ff"/>
  <rect x="1275" y="715" width="10" height="10" fill="#4cc8ff"/>

</svg>
